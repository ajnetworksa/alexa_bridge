name: "Alexa Matter Bridge"
version: "1.1.0"
slug: "alexa_matter_bridge"
description: >
  Local Alexa control for Home Assistant through Matter. Pick devices with a
  switch, scan the QR code in the Alexa app, done. Powered by Matterbridge.

url: "https://github.com/ajnetworksa/alexa_bridge"

arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false

host_network: true

homeassistant_api: true
hassio_api: true
hassio_role: default
auth_api: false

ingress: true
ingress_port: 8095
ingress_stream: true
webui: "http://[HOST]:[PORT:8283]"

panel_icon: "mdi:amazon-alexa"
panel_title: "Alexa Bridge"

ports:
  5540/tcp: 5540
  5540/udp: 5540
  8283/tcp: 8283

ports_description:
  5540/tcp: "Matter bridge TCP"
  5540/udp: "Matter bridge UDP"
  8283/tcp: "Matterbridge Web UI"

map:
  - share:rw

options:
  matter_port: 5540
  log_level: "info"
  auto_expose_label: "alexa"
  backup_commissioning: true
  excluded_entity_prefixes:
    - "automation."
    - "scene."
    - "script."
    - "group."
    - "device_tracker."
    - "person."
    - "zone."
    - "timer."
    - "input_boolean."
    - "input_number."
    - "input_select."
    - "input_text."
    - "input_datetime."
    - "counter."

schema:
  matter_port: int
  log_level: "list(debug|info|warn|error)"
  auto_expose_label: str
  backup_commissioning: bool
  excluded_entity_prefixes:
    - str
